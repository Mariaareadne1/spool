<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="ui-monospace, Menlo, monospace" font-size="13">
  <rect width="1200" height="720" fill="#0d0c0a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9a9183"/>
    </marker>
    <style>
      .box{fill:#15130f;stroke:rgba(237,230,218,.22);stroke-width:1}
      .t{fill:#ede6da;font-size:14px}
      .s{fill:#9a9183;font-size:11.5px}
      .h{fill:#6b6458;font-size:11px;letter-spacing:.12em}
      .l{stroke:#9a9183;stroke-width:1.2;fill:none;marker-end:url(#a)}
      .d{stroke:#9a9183;stroke-width:1.2;fill:none;stroke-dasharray:4 4;marker-end:url(#a)}
    </style>
  </defs>
  <text x="40" y="44" fill="#ede6da" font-family="Georgia, serif" font-style="italic" font-size="26">Spool — how a gesture becomes a thread becomes a WAV</text>

  <!-- column headings -->
  <text class="h" x="40" y="92">INPUT</text>
  <text class="h" x="330" y="92">INTERPRET</text>
  <text class="h" x="620" y="92">STATE (IMMUTABLE)</text>
  <text class="h" x="910" y="92">OUTPUT</text>

  <!-- input -->
  <rect class="box" x="40" y="110" width="240" height="70" rx="8"/>
  <text class="t" x="56" y="138">Webcam → HandLandmarker</text>
  <text class="s" x="56" y="160">MediaPipe · 21 points × 2 hands</text>
  <rect class="box" x="40" y="200" width="240" height="70" rx="8"/>
  <text class="t" x="56" y="228">Synthetic landmark fixtures</text>
  <text class="s" x="56" y="250">tests → __spool.feedHands()</text>
  <rect class="box" x="40" y="330" width="240" height="70" rx="8"/>
  <text class="t" x="56" y="358">Pointer · keys</text>
  <text class="s" x="56" y="380">rail, ring, home row, sculpt drag</text>

  <!-- interpret -->
  <rect class="box" x="330" y="110" width="240" height="96" rx="8"/>
  <text class="t" x="346" y="138">GestureInterpreter</text>
  <text class="s" x="346" y="160">palm-normalised pinch (hysteresis)</text>
  <text class="s" x="346" y="178">One-Euro smoothing · role tracking</text>
  <text class="s" x="346" y="196">open-palm dwell</text>
  <rect class="box" x="330" y="226" width="240" height="96" rx="8"/>
  <text class="t" x="346" y="254">GestureController</text>
  <text class="s" x="346" y="276">frames → commands: noteOn, glide,</text>
  <text class="s" x="346" y="294">retune, grab, drag, stretch, drop,</text>
  <text class="s" x="346" y="312">toggleRecord</text>

  <!-- state -->
  <rect class="box" x="620" y="110" width="240" height="96" rx="8"/>
  <text class="t" x="636" y="138">SpoolApp (controller)</text>
  <text class="s" x="636" y="160">one snapshot → React via</text>
  <text class="s" x="636" y="178">useSyncExternalStore; canvas reads</text>
  <text class="s" x="636" y="196">it directly each frame</text>
  <rect class="box" x="620" y="226" width="240" height="70" rx="8"/>
  <text class="t" x="636" y="254">Recorder</text>
  <text class="s" x="636" y="276">absolute beats → phrase, 1/16 snap</text>
  <rect class="box" x="620" y="316" width="240" height="96" rx="8"/>
  <text class="t" x="636" y="344">Project + History</text>
  <text class="s" x="636" y="366">notes in scale degrees + beats</text>
  <text class="s" x="636" y="384">pure transforms: transpose, shift,</text>
  <text class="s" x="636" y="402">stretch · undo = previous value</text>
  <rect class="box" x="620" y="432" width="240" height="56" rx="8"/>
  <text class="t" x="636" y="458">localStorage · JSON</text>
  <text class="s" x="636" y="476">every load re-validated</text>

  <!-- output -->
  <rect class="box" x="910" y="110" width="250" height="96" rx="8"/>
  <text class="t" x="926" y="138">AudioEngine (live)</text>
  <text class="s" x="926" y="160">25 ms timer, 120 ms lookahead</text>
  <text class="s" x="926" y="178">notesInWindow() → startVoice()</text>
  <text class="s" x="926" y="196">at sample-accurate times</text>
  <rect class="box" x="910" y="226" width="250" height="96" rx="8"/>
  <text class="t" x="926" y="254">SpoolRenderer (canvas)</text>
  <text class="s" x="926" y="276">angle = time, ring = thread,</text>
  <text class="s" x="926" y="294">radius = pitch; static layer cached,</text>
  <text class="s" x="926" y="312">playhead + glow per frame</text>
  <rect class="box" x="910" y="342" width="250" height="96" rx="8"/>
  <text class="t" x="926" y="370">renderProject (offline)</text>
  <text class="s" x="926" y="392">same voices + mix graph in an</text>
  <text class="s" x="926" y="410">OfflineAudioContext → encodeWav</text>
  <text class="s" x="926" y="428">→ decode + check → download</text>

  <!-- shared core band -->
  <rect x="330" y="520" width="830" height="170" rx="10" fill="none" stroke="rgba(236,214,160,.45)" stroke-dasharray="3 5"/>
  <text class="h" x="350" y="546" style="fill:#ecd6a0">SHARED, PURE, UNIT-TESTED IN NODE (node-web-audio-api)</text>
  <text class="s" x="350" y="574">theory.ts — scale degree → MIDI → Hz, chord stacking</text>
  <text class="s" x="350" y="596">schedule.ts — notesInWindow(): the one definition of "when" a note sounds</text>
  <text class="s" x="350" y="618">voices.ts + mix.ts — one graph for live, export and tests (envelopes scheduled analytically)</text>
  <text class="s" x="350" y="640">geometry.ts — the polar system used both to draw and to hit-test</text>
  <text class="s" x="350" y="662">analysis.ts — FFT pitch, spectral-flux onsets: verifies the exported audio matches the score</text>

  <!-- arrows -->
  <path class="l" d="M280 145H330"/>
  <path class="d" d="M280 235C305 235 305 160 330 160"/>
  <path class="l" d="M450 206V226"/>
  <path class="l" d="M570 274C595 274 595 170 620 170"/>
  <path class="l" d="M280 365C450 365 450 190 620 190"/>
  <path class="l" d="M740 206V226"/>
  <path class="l" d="M740 296V316"/>
  <path class="l" d="M740 412V432"/>
  <path class="l" d="M860 150H910"/>
  <path class="l" d="M860 175C885 175 885 270 910 270"/>
  <path class="l" d="M860 380C885 380 885 390 910 390"/>
</svg>
